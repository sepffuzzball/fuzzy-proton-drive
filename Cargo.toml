[package]
name = "fuzzy-proton-drive"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
blake3 = "1"
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland"] }
egui_extras = "0.33.3"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
